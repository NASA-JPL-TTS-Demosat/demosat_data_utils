[project]
name = "tts-demosat-data-utils"
description = "DemoSat implementations of data utilities."
readme = "README.md"
requires-python = ">=3.6"
license = {text = "Unlicense"}
authors = [
  { name = "muszynsk", email = "matt.muszynski@jpl.nasa.gov" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Unlicense",
]
dependencies = [
    "tts-data-utils",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/NASA-JPL-TTS-Demosat/demosat_data_utils"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[build-system]
requires = [
    "setuptools", 
    "setuptools_scm",
    "toml", 
    "wheel", 
    "tts-utilities~=0.2.1"
    ]
build-backend = "setuptools.build_meta"

